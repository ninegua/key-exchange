name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_NOT_TRACK: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install dependencies
        run: nix-shell --run 'make deps'

      - name: Build backend and frontend
        run: nix-shell --run 'make build-all'

      - name: Run unit tests
        run: nix-shell --run 'make test-unit'

      - name: Run end-to-end tests
        run: nix-shell --run 'make test-e2e'
